<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="100%" height="140" style="background-color: transparent;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="878" height="138" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Block 1: Second Brain -->
  <rect x="20" y="20" width="250" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="145" y="52" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Second Brain (Tiago Forte)</text>
  <text x="145" y="74" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">C.O.D.E. + P.A.R.A. Method</text>
  <text x="145" y="94" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Knowledge Architecture</text>

  <!-- Connection Line 1 -> 2 -->
  <line x1="270" y1="70" x2="310" y2="70" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Block 2: Dual-Track Architecture -->
  <rect x="315" y="20" width="250" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="440" y="52" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Dual-Track Architecture</text>
  <text x="440" y="74" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Build (Code Pipeline)</text>
  <text x="440" y="94" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">x Run (Operations &amp; Field)</text>

  <!-- Connection Line 2 -> 3 -->
  <line x1="565" y1="70" x2="605" y2="70" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Block 3: Immutable Decisions -->
  <rect x="610" y="20" width="250" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="735" y="52" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Immutable Decisions</text>
  <text x="735" y="74" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">B-ADR (Architectural Records)</text>
  <text x="735" y="94" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">R-ODR (Operational Records)</text>
</svg>
